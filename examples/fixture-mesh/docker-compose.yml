version: "3.9"

services:
  orders-svc:
    build: ./services/orders
    ports:
      - "8080:8080"
    environment:
      ORDERS_TOPIC: orders.created
      POSTGRES_DSN: postgres://orders:secret@orders-db:5432/orders
    depends_on:
      - orders-db
      - kafka

  billing-svc:
    build: ./services/billing
    environment:
      ORDERS_SERVICE_URL: http://orders-svc:8080
      BILLING_GROUP_ID: billing
      REDIS_URL: redis://billing-cache:6379/0
    depends_on:
      - billing-cache
      - kafka

  notifications-svc:
    build: ./services/notifications
    environment:
      KAFKA_BROKER: kafka:9092
    depends_on:
      - kafka

  orders-db:
    image: postgres:16
    environment:
      POSTGRES_DB: orders

  billing-cache:
    image: redis:7

  kafka:
    image: confluentinc/cp-kafka:7.6.0
