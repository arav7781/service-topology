name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify the skill
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: The skill ships no runtime code
        run: |
          stray=$(find skills .github/skills .cursor/skills .agents/skills agents \
            .github/agents .cursor/agents .agents/agents -type f ! -name '*.md')
          if [ -n "$stray" ]; then
            echo "the skill must stay Markdown-only:"; echo "$stray"; exit 1
          fi

      - name: Host trees mirror the canonical skill
        run: bash tools/sync-hosts.sh --check

      - name: Instructions stay inside their token budget
        run: bash tools/token-budget.sh

      - name: Example ledgers are canonical and every receipt resolves
        run: |
          bash tools/check-ledger.sh examples/fixture-mesh \
            examples/fixture-mesh/service-topology/topology.ledger

      - name: Manifests are valid JSON and versions agree
        run: |
          jq -e . .claude-plugin/plugin.json .claude-plugin/marketplace.json .vscode/extensions.json > /dev/null
          plugin=$(jq -r .version .claude-plugin/plugin.json)
          market=$(jq -r '.plugins[] | select(.name == "topology-cartographer") | .version' .claude-plugin/marketplace.json)
          test "$plugin" = "$market" || { echo "plugin.json $plugin != marketplace.json $market"; exit 1; }
          echo "ok: topology-cartographer $plugin"
