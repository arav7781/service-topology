name: Bug report
description: Something mechanical broke - the skill didn't load or trigger, a host mirror is out of date, a view doesn't render, or a repository tool failed.
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        This form is for **mechanical** problems. If the skill ran but the
        *map* is wrong - a missed binding, a false edge, a misjudged service
        boundary - use the **Extraction issue** form instead. That's the report
        this project is built to act on.
  - type: dropdown
    id: host
    attributes:
      label: Host
      options:
        - Claude Code
        - GitHub Copilot (VS Code)
        - Cursor
        - Antigravity
        - Another agent (via AGENTS.md)
        - Not host-specific (repository tooling)
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Skill loading / triggering
        - A view (Mermaid or draw.io) doesn't render
        - Ledger format
        - Helper agents (topology-extractor / topology-verifier)
        - tools/sync-hosts.sh
        - tools/check-ledger.sh
        - tools/token-budget.sh
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: The exact prompt or command, and the output or wrong behaviour.
      placeholder: |
        Asked: "what does billing-svc talk to?"
        Got: ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, host and version, model.
      placeholder: Windows 11 · Claude Code 2.x · Opus
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I reproduced this on the latest `main`.
          required: true
        - label: This is not a security issue (those go through [SECURITY.md](https://github.com/arav7781/service-topology/blob/main/SECURITY.md), privately).
          required: true
