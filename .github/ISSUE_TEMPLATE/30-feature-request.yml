name: Feature request
description: Propose a new ecosystem, lens, review check, host, or a change to the ledger format.
title: "[feat] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Check the [roadmap](https://github.com/arav7781/service-topology#roadmap)
        first — your idea may already be scheduled for a version, or may
        already be ruled out (runtime observation, a runtime dependency, a
        custom renderer).
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - New Kafka ecosystem / client library
        - New sync-call framework (HTTP/gRPC)
        - New message broker (RabbitMQ, SNS/SQS, Pub/Sub, ...)
        - Config resolution (a new config format or source)
        - Lens / diagram conventions
        - New host support
        - Review checks (smells)
        - Ledger format
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: The problem, as observed
      description: What real repository or workflow does this affect? A concrete case beats a general one.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: The smallest version that solves the observed problem. What is explicitly out of scope?
    validations:
      required: true
  - type: textarea
    id: cost
    attributes:
      label: What it costs
      description: Does this add a runtime dependency (the project has none by design), grow an instruction file past its token budget, or change what counts as CODE vs INFERENCE?
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Confirmations
      options:
        - label: I checked the roadmap and this doesn't conflict with a stated non-goal.
          required: true
        - label: I searched existing issues for prior proposals of this.
          required: true
